<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<title>Anatomy Atlas</title>
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { color-scheme: dark; --fg: #eaf1f7; --bg: #0a0f14; --line: #26323d; --scan: #65b4ff; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg); font: 16px/1.5 Arial, sans-serif; }
main { width: min(760px, 100%); }
h1 { margin: 0 0 18px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
a { display: block; padding: 12px 14px; color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 8px; }
a:hover, a:focus-visible { border-color: var(--scan); outline: none; }
.install { display: none; margin: 18px auto 0; width: fit-content; border: 1px solid var(--scan); background: transparent; color: var(--fg); padding: 10px 14px; border-radius: 8px; font: 600 14px/1 Arial, sans-serif; cursor: pointer; }
.install.visible { display: block; }
.ios-help { display: none; margin: 14px 0 0; text-align: center; color: #aebbc7; font-size: 13px; }
.ios-help.visible { display: block; }
</style>
<main>
  <h1>Anatomy Atlas</h1>
  <div class="grid">
    <a href="bone-atlas/index.html">Bone Atlas</a>
    <a href="bone-landmarks/index.html">Bone Landmarks</a>
    <a href="muscle-atlas/index.html">Muscle Atlas</a>
    <a href="joint-atlas/index.html">Joint Atlas</a>
    <a href="nerve-atlas/index.html">Nerve Atlas</a>
    <a href="heart-atlas/index.html">Heart Atlas</a>
    <a href="lymph-atlas/index.html">Lymph Atlas</a>
    <a href="organ-atlas/index.html">Organ Atlas</a>
    <a href="brain-atlas/index.html">Brain Atlas</a>
    <a href="tooth-atlas/index.html">Tooth Atlas</a>
  </div>
  <button class="install" id="installApp" type="button">Install Anatomy Atlas</button>
  <p class="ios-help" id="iosHelp">On iPhone or iPad: tap Share, then “Add to Home Screen”.</p>
</main>
<script>
let installPrompt;
const installButton = document.getElementById('installApp');
const iosHelp = document.getElementById('iosHelp');
const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (ios && !window.matchMedia('(display-mode: standalone)').matches) iosHelp.classList.add('visible');
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  installPrompt = event;
  installButton.classList.add('visible');
});
installButton.addEventListener('click', async () => {
  if (!installPrompt) return;
  installPrompt.prompt();
  await installPrompt.userChoice;
  installPrompt = null;
  installButton.classList.remove('visible');
});
window.addEventListener('appinstalled', () => installButton.classList.remove('visible'));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./service-worker.js').catch(() => {});
</script>
</html>
